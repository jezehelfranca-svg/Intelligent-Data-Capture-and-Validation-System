[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engiverify"
version = "0.2.0"
description = "Engineering document ingestion, traceability, and validation foundation"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["engiverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
